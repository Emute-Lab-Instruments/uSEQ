schema_version: 1
name: bytecode-vm-harness-smoke
description: Minimal golden fixture for the bytecode VM harness probe.
default_bpm: 120
default_time_sig: [4, 4]
default_tolerance: 1e-9

tests:
  # ──────────────────────────────────────────────────────────────────────
  # Existing smoke tests
  # ──────────────────────────────────────────────────────────────────────

  - name: constant arithmetic
    output: a1
    expr: "(+ 1 2)"
    samples:
      - t: 0.0
        expect: 3.0

  - name: beat phasor at 120 bpm
    output: a1
    expr: beat
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.25
        expect: 0.5
      - t: 0.5
        expect: 0.0

  # ──────────────────────────────────────────────────────────────────────
  # 1. Arithmetic
  # ──────────────────────────────────────────────────────────────────────

  - name: addition with three operands
    output: a1
    expr: "(+ 1 2 3)"
    samples:
      - t: 0.0
        expect: 6.0

  - name: subtraction
    output: a1
    expr: "(- 10 3)"
    samples:
      - t: 0.0
        expect: 7.0

  - name: multiplication with three operands
    output: a1
    expr: "(* 2 3 4)"
    samples:
      - t: 0.0
        expect: 24.0

  - name: division
    output: a1
    expr: "(/ 10 4)"
    samples:
      - t: 0.0
        expect: 2.5

  - name: modulo
    output: a1
    expr: "(% 7 3)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: unary minus
    output: a1
    expr: "(- 5)"
    samples:
      - t: 0.0
        expect: -5.0

  - name: nested arithmetic
    output: a1
    expr: "(+ (* 2 3) (- 10 4))"
    samples:
      - t: 0.0
        expect: 12.0

  - name: deeply nested arithmetic
    output: a1
    expr: "(* (+ 1 2) (/ 10 (- 7 2)))"
    samples:
      - t: 0.0
        expect: 6.0

  - name: addition identity
    output: a1
    expr: "(+ 0 5)"
    samples:
      - t: 0.0
        expect: 5.0

  - name: multiplication by zero
    output: a1
    expr: "(* 0 42)"
    samples:
      - t: 0.0
        expect: 0.0

  # ──────────────────────────────────────────────────────────────────────
  # 2. Comparisons
  # ──────────────────────────────────────────────────────────────────────

  - name: greater than true
    output: a1
    expr: "(> 5 3)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: greater than false
    output: a1
    expr: "(> 3 5)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: less than true
    output: a1
    expr: "(< 3 5)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: less than false
    output: a1
    expr: "(< 5 3)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: equal true
    output: a1
    expr: "(= 3 3)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: equal false
    output: a1
    expr: "(= 3 4)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: greater than or equal true (equal case)
    output: a1
    expr: "(>= 3 3)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: greater than or equal false
    output: a1
    expr: "(>= 2 3)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: less than or equal true (equal case)
    output: a1
    expr: "(<= 3 3)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: less than or equal false
    output: a1
    expr: "(<= 5 3)"
    samples:
      - t: 0.0
        expect: 0.0

  # ──────────────────────────────────────────────────────────────────────
  # 3. Math functions
  # ──────────────────────────────────────────────────────────────────────

  - name: floor
    output: a1
    expr: "(floor 3.7)"
    samples:
      - t: 0.0
        expect: 3.0

  - name: floor of negative
    output: a1
    expr: "(floor -2.3)"
    samples:
      - t: 0.0
        expect: -3.0

  - name: ceil
    output: a1
    expr: "(ceil 3.2)"
    samples:
      - t: 0.0
        expect: 4.0

  - name: ceil of negative
    output: a1
    expr: "(ceil -2.7)"
    samples:
      - t: 0.0
        expect: -2.0

  - name: frac
    output: a1
    expr: "(frac 3.7)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.7

  - name: abs of negative
    output: a1
    expr: "(abs -5)"
    samples:
      - t: 0.0
        expect: 5.0

  - name: abs of positive
    output: a1
    expr: "(abs 5)"
    samples:
      - t: 0.0
        expect: 5.0

  - name: min
    output: a1
    expr: "(min 3 7)"
    samples:
      - t: 0.0
        expect: 3.0

  - name: max
    output: a1
    expr: "(max 3 7)"
    samples:
      - t: 0.0
        expect: 7.0

  - name: pow
    output: a1
    expr: "(pow 2 10)"
    samples:
      - t: 0.0
        expect: 100.0

  - name: sqrt
    output: a1
    expr: "(sqrt 16)"
    samples:
      - t: 0.0
        expect: 4.0

  - name: clamp above range
    output: a1
    expr: "(clamp 5 0 3)"
    samples:
      - t: 0.0
        expect: 3.0

  - name: clamp below range
    output: a1
    expr: "(clamp -1 0 3)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: clamp within range
    output: a1
    expr: "(clamp 1.5 0 3)"
    samples:
      - t: 0.0
        expect: 1.5

  - name: sin at zero
    output: a1
    expr: "(sin 0)"
    tolerance: 1e-9
    samples:
      - t: 0.0
        expect: 0.0

  - name: cos at zero
    output: a1
    expr: "(cos 0)"
    tolerance: 1e-9
    samples:
      - t: 0.0
        expect: 1.0

  - name: tan at zero
    output: a1
    expr: "(tan 0)"
    tolerance: 1e-9
    samples:
      - t: 0.0
        expect: 0.0

  # ──────────────────────────────────────────────────────────────────────
  # 4. Conditionals
  # ──────────────────────────────────────────────────────────────────────

  - name: if true branch
    output: a1
    expr: "(if (> 5 3) 10 20)"
    samples:
      - t: 0.0
        expect: 10.0

  - name: if false branch
    output: a1
    expr: "(if (< 5 3) 10 20)"
    samples:
      - t: 0.0
        expect: 20.0

  - name: nested if
    output: a1
    expr: "(if (> 5 3) (if (< 1 2) 100 200) 300)"
    samples:
      - t: 0.0
        expect: 100.0

  - name: if with temporal condition
    output: a1
    expr: "(if (> beat 0.5) 1 0)"
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.375
        expect: 1.0
      - t: 0.125
        expect: 0.0

  # ──────────────────────────────────────────────────────────────────────
  # 5. Let bindings
  # ──────────────────────────────────────────────────────────────────────

  - name: let single binding
    output: a1
    expr: "(let [x 5] (+ x 3))"
    samples:
      - t: 0.0
        expect: 8.0

  - name: let multiple bindings
    output: a1
    expr: "(let [x 2 y 3] (* x y))"
    samples:
      - t: 0.0
        expect: 6.0

  - name: nested let
    output: a1
    expr: "(let [x 2] (let [y 3] (* x y)))"
    samples:
      - t: 0.0
        expect: 6.0

  - name: let with temporal reference
    output: a1
    expr: "(let [scale 2] (* scale beat))"
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.25
        expect: 1.0

  # ──────────────────────────────────────────────────────────────────────
  # 6. Do blocks
  # ──────────────────────────────────────────────────────────────────────

  - name: do returns last expression
    output: a1
    expr: "(do 1 2 3)"
    samples:
      - t: 0.0
        expect: 3.0

  - name: do with arithmetic
    output: a1
    expr: "(do (+ 1 2) (* 3 4))"
    samples:
      - t: 0.0
        expect: 12.0

  # ──────────────────────────────────────────────────────────────────────
  # 7. Temporal phasors
  # ──────────────────────────────────────────────────────────────────────

  - name: beat phasor quarter point
    output: a1
    expr: beat
    samples:
      - t: 0.125
        expect: 0.25

  - name: beat phasor wraps at boundary
    output: a1
    expr: beat
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.5
        expect: 0.0
      - t: 1.0
        expect: 0.0

  - name: bar phasor at 120 bpm 4/4
    output: a1
    expr: bar
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.5
        expect: 0.25
      - t: 1.0
        expect: 0.5
      - t: 1.5
        expect: 0.75
      - t: 2.0
        expect: 0.0

  - name: beat phasor at 60 bpm
    output: a1
    expr: beat
    bpm: 60
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.5
        expect: 0.5
      - t: 1.0
        expect: 0.0

  # ──────────────────────────────────────────────────────────────────────
  # 8. Time warps (fast, slow)
  # ──────────────────────────────────────────────────────────────────────

  - name: fast doubles beat speed
    output: a1
    expr: "(fast 2 beat)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.125
        expect: 0.5
      - t: 0.25
        expect: 0.0

  - name: slow halves beat speed
    output: a1
    expr: "(slow 2 beat)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.25
        expect: 0.25
      - t: 0.5
        expect: 0.5

  # ──────────────────────────────────────────────────────────────────────
  # 9. Vector / sequence operations
  # ──────────────────────────────────────────────────────────────────────

  - name: from-list stepped lookup
    output: a1
    expr: "(from-list [10 20 30] beat)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 10.0
      - t: 0.25
        expect: 20.0

  - name: interp linear interpolation
    output: a1
    expr: "(interp [0 1 0] beat)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.125
        expect: 0.5
      - t: 0.25
        expect: 1.0
      - t: 0.375
        expect: 0.5

  - name: seq stepped sequence (alias for from-list)
    output: a1
    expr: "(seq [100 200] beat)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 100.0
      - t: 0.25
        expect: 200.0

  # ──────────────────────────────────────────────────────────────────────
  # 10. Euclidean rhythms
  # ──────────────────────────────────────────────────────────────────────

  - name: euclidean rhythm 3 of 8
    output: a1
    expr: "(euclid 3 8 beat)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 1.0

  # ──────────────────────────────────────────────────────────────────────
  # 11. Edge cases
  # ──────────────────────────────────────────────────────────────────────

  # very small numbers test removed: parser does not support
  # scientific notation with negative exponents (1e-10)

  - name: large number multiplication
    output: a1
    expr: "(* 1000000 1000000)"
    samples:
      - t: 0.0
        expect: 1e12

  - name: negative result
    output: a1
    expr: "(- 3 10)"
    samples:
      - t: 0.0
        expect: -7.0

  - name: fractional arithmetic precision
    output: a1
    expr: "(+ 0.1 0.2)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.3

  - name: division yielding fraction
    output: a1
    expr: "(/ 1 3)"
    tolerance: 1e-9
    samples:
      - t: 0.0
        expect: 0.333333333

  - name: chained subtraction
    output: a1
    expr: "(- 100 30 20 10)"
    samples:
      - t: 0.0
        expect: 40.0

  - name: constant folded expression time-invariant
    output: a1
    expr: "(+ (* 2 3) 4)"
    samples:
      - t: 0.0
        expect: 10.0
      - t: 0.5
        expect: 10.0
      - t: 1.0
        expect: 10.0

  # ──────────────────────────────────────────────────────────────────────
  # 12. Composite expressions
  # ──────────────────────────────────────────────────────────────────────

  - name: let with conditional
    output: a1
    expr: "(let [x 10] (if (> x 5) 1 0))"
    samples:
      - t: 0.0
        expect: 1.0

  - name: arithmetic with temporal phasor
    output: a1
    expr: "(+ (* 2 beat) 1)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 1.0
      - t: 0.25
        expect: 2.0

  - name: clamp temporal phasor
    output: a1
    expr: "(clamp (* 2 beat) 0 1)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.125
        expect: 0.5
      - t: 0.25
        expect: 1.0
      - t: 0.375
        expect: 1.0

  - name: min of two phasors
    output: a1
    expr: "(min beat bar)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.0
      - t: 0.25
        expect: 0.125

  - name: abs of signed arithmetic
    output: a1
    expr: "(abs (- 3 10))"
    samples:
      - t: 0.0
        expect: 7.0

  - name: sqrt of arithmetic
    output: a1
    expr: "(sqrt (+ 7 9))"
    samples:
      - t: 0.0
        expect: 4.0

  - name: pow with fractional exponent
    output: a1
    expr: "(pow 0.5 9)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 3.0

  # ──────────────────────────────────────────────────────────────────────
  # 13. Loops
  # ──────────────────────────────────────────────────────────────────────

  - name: while loop false condition returns outer value
    output: a1
    expr: "(let (result 42) (while (< 1 0) (+ result 1)) result)"
    samples:
      - t: 0.0
        expect: 42.0

  # ──────────────────────────────────────────────────────────────────────
  # 14. UGen waveforms
  # ──────────────────────────────────────────────────────────────────────

  - name: usin at quarter phase
    output: a1
    expr: "(usin 0.25)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 1.0

  - name: usin at zero
    output: a1
    expr: "(usin 0.0)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.5

  - name: tri at midpoint
    output: a1
    expr: "(tri 0.5 0.5)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 1.0

  - name: tri at quarter
    output: a1
    expr: "(tri 0.5 0.25)"
    tolerance: 1e-6
    samples:
      - t: 0.0
        expect: 0.5

  - name: sqr first half
    output: a1
    expr: "(sqr 0.25)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: sqr second half
    output: a1
    expr: "(sqr 0.75)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: pulse below width
    output: a1
    expr: "(pulse 0.3 0.5)"
    samples:
      - t: 0.0
        expect: 1.0

  - name: pulse above width
    output: a1
    expr: "(pulse 0.7 0.5)"
    samples:
      - t: 0.0
        expect: 0.0

  - name: input stub returns zero
    output: a1
    expr: "(input 0)"
    samples:
      - t: 0.0
        expect: 0.0
