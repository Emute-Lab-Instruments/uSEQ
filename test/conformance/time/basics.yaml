# Time and phasors — docs/specs/time.md (engine at bpm 120, 4 beats/bar)
- name: t-is-real-valued-seconds
  spec: time.md §1.1
  tags: [smoke, time]
  steps:
    - eval: "(a1 t)"
    - sample: {output: a1, times: [0.0, 0.5, 1.25]}
      expect_values: [0.0, 0.5, 1.25]

- name: beat-phasor-formula
  spec: time.md §1.2
  tags: [smoke, time]
  steps:
    # beat = fmod(t * (bpm/60), 1) = fmod(2t, 1) at bpm 120
    - eval: "(a1 beat)"
    - sample: {output: a1, times: [0.0, 0.25, 0.5, 0.75]}
      expect_values: [0.0, 0.5, 0.0, 0.5]

- name: bar-phasor-formula
  spec: time.md §1.2
  tags: [smoke, time]
  steps:
    # bar = fmod(t * (bpm/60/beats-per-bar), 1) = fmod(t/2, 1)
    - eval: "(a1 bar)"
    - sample: {output: a1, times: [0.0, 1.0, 2.0, 3.0]}
      expect_values: [0.0, 0.5, 0.0, 0.5]

- name: beat-num-counter-never-wraps
  spec: time.md §1.3
  tags: [smoke, time]
  steps:
    # beat-num = floor(t * bpm / 60) = floor(2t)
    - eval: "(a1 beat-num)"
    - sample: {output: a1, times: [0.0, 0.49, 0.5, 2.6]}
      expect_values: [0.0, 0.0, 1.0, 5.0]

- name: beat-dur-and-bar-dur-cells
  spec: time.md §1.4
  tags: [smoke, time]
  steps:
    # beat-dur = 60/bpm = 0.5s; bar-dur = beat-dur * beats-per-bar = 2s
    - eval: "(a1 beat-dur)"
    - sample: {output: a1, times: [0.0]}
      expect_values: [0.5]
    - eval: "(a2 bar-dur)"
    - sample: {output: a2, times: [0.0]}
      expect_values: [2.0]

- name: redefining-bpm-updates-phasors
  spec: time.md §1.5
  tags: [full, time, cells]
  steps:
    - eval: "(a1 beat-dur)"
    - sample: {output: a1, times: [0.0]}
      expect_values: [0.5]
    - eval: "(define bpm 60)"
    - sample: {output: a1, times: [0.0]}
      expect_values: [1.0]
