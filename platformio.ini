; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Default environment - Music Thing Modular variant
default_envs = musicthing
; Source code location
src_dir = uSEQ
; Build output directory
build_dir = .pio/build
; Cache directory
build_cache_dir = .pio/cache

; =============================================================================
; COMMON SETTINGS - Shared across all environments
; =============================================================================

[env]
; Raspberry Pi Pico platform (Earle Philhower core via maxgerhardt platform)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino

; Board configuration
board_build.core = earlephilhower
board_build.f_cpu = 250000000L          ; 250MHz overclock

; Compiler optimization and flags
build_flags =
    -O3                                  ; Maximum optimization (matches Optimize3)
    -Wall                                ; Enable all warnings
    -Wextra                              ; Extra warnings
    -DUSE_NOT_IN_FLASH=1                ; Enable __not_in_flash decorations
    -std=gnu++17                         ; C++17 standard with GNU extensions

; Source filter: exclude legacy directories and files not part of the
; new firmware architecture.  New-architecture sources (firmware/,
; signal_engine/) are included by the default +<*> rule.
build_src_filter =
    +<*>
    -<src/utils.cpp>
    -<src/uSEQ/>
    -<src/dsp/>
    -<src/io/>
    -<src/ports/>
    -<src/ml/>

; Upload settings
upload_protocol = picotool
monitor_speed = 115200

; Build settings
build_unflags =
    -Os                                  ; Remove size optimization (we want -O3)

; =============================================================================
; HARDWARE ENVIRONMENTS
; =============================================================================

; -----------------------------------------------------------------------------
; Music Thing Modular - Default variant
; -----------------------------------------------------------------------------
[env:musicthing]
; Music Thing has 16MB flash - use generic RP2040 board
board = generic
board_build.filesystem_size = 14M        ; 14MB for filesystem
build_flags =
    ${env.build_flags}
    -DMUSICTHING                         ; Music Thing hardware variant
    -DDIGI_OUT_INVERTED                  ; Digital outputs are inverted
    -DANALOG_OUT_INVERTED                ; Analog outputs are inverted
    -DAUDIO_OUT_INVERTED                 ; Audio outputs are inverted
    -DENABLE_SIGNAL_ENGINE                ; Enable signal engine (eval + execute)
    -DENABLE_DSP_ENGINE                  ; Enable DSP processing
    -DENABLE_TEMPO_ESTIMATOR             ; Enable tempo estimation
    -DENABLE_I2C_NETWORKING              ; Enable I2C communication
    -DENABLE_I2C_HOST                    ; Enable I2C host mode
    -DENABLE_I2C_CLIENT                  ; Enable I2C client mode
    -DENABLE_FLASH_STORAGE               ; Enable flash storage
    -DENABLE_LED_CONTROL                 ; Enable LED control
    -DENABLE_RGB_LED                     ; Enable RGB LED support
    -DENABLE_ANALOG_INPUTS               ; Enable analog inputs
    -DENABLE_DIGITAL_IO                  ; Enable digital I/O
    -DENABLE_ENCODER_INPUT               ; Enable rotary encoder
    -DUSE_FIXED_MEMORY_POOLS             ; Use fixed memory pools for embedded
    -DENABLE_SERIAL_DEBUG                ; Enable serial debugging
    -DENABLE_DIAGNOSTICS                 ; Enable diagnostic output
    -DENABLE_PROFILING                   ; Enable performance profiling
    -DUSEQ_DEVTOOLS=1                    ; Enable devtools telemetry

; Flash configuration for Music Thing (16MB flash, W25Q080 chip)
board_build.boot2 = boot2_w25q080_2_padded_checksum

; -----------------------------------------------------------------------------
; uSEQ Hardware v0.2
; -----------------------------------------------------------------------------
[env:hardware_v0_2]
; Hardware v0.2 has standard 2MB flash
board_build.filesystem_size = 1M        ; 1MB for filesystem
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2                   ; Hardware v0.2 variant
    -DENABLE_SIGNAL_ENGINE                ; Enable signal engine (eval + execute)
    -DENABLE_DSP_ENGINE                  ; Enable DSP processing
    -DENABLE_I2C_NETWORKING              ; Enable I2C communication
    -DENABLE_I2C_HOST                    ; Enable I2C host mode
    -DENABLE_I2C_CLIENT                  ; Enable I2C client mode
    -DENABLE_FLASH_STORAGE               ; Enable flash storage
    -DENABLE_LED_CONTROL                 ; Enable LED control
    -DENABLE_ANALOG_INPUTS               ; Enable analog inputs
    -DENABLE_DIGITAL_IO                  ; Enable digital I/O
    -DENABLE_ENCODER_INPUT               ; Enable rotary encoder
    -DUSE_FIXED_MEMORY_POOLS             ; Use fixed memory pools for embedded
    -DENABLE_SERIAL_DEBUG                ; Enable serial debugging
    -DENABLE_DIAGNOSTICS                 ; Enable diagnostic output

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; -----------------------------------------------------------------------------
; uSEQ Hardware v1.0
; -----------------------------------------------------------------------------
[env:hardware_v1_0]
; Hardware v1.0 has standard 2MB flash
board_build.filesystem_size = 1M        ; 1MB for filesystem
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0                   ; Hardware v1.0 variant
    -DENABLE_SIGNAL_ENGINE                ; Enable signal engine (eval + execute)
    -DENABLE_DSP_ENGINE                  ; Enable DSP processing
    -DENABLE_TEMPO_ESTIMATOR             ; Enable tempo estimation
    -DENABLE_I2C_NETWORKING              ; Enable I2C communication
    -DENABLE_I2C_HOST                    ; Enable I2C host mode
    -DENABLE_I2C_CLIENT                  ; Enable I2C client mode
    -DENABLE_FLASH_STORAGE               ; Enable flash storage
    -DENABLE_LED_CONTROL                 ; Enable LED control
    -DENABLE_ANALOG_INPUTS               ; Enable analog inputs
    -DENABLE_DIGITAL_IO                  ; Enable digital I/O
    -DUSE_FIXED_MEMORY_POOLS             ; Use fixed memory pools for embedded
    -DENABLE_SERIAL_DEBUG                ; Enable serial debugging
    -DENABLE_DIAGNOSTICS                 ; Enable diagnostic output

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; -----------------------------------------------------------------------------
; Minimal Build - Bare minimum features for testing/debugging
; -----------------------------------------------------------------------------
[env:minimal]
; Minimal build - use standard 2MB Pico flash, no filesystem
board_build.filesystem_size = 0M        ; No filesystem for minimal build
build_flags =
    ${env.build_flags}
    -DMUSICTHING                         ; Use Music Thing hardware as base
    -DMINIMAL_BUILD                      ; Enable minimal build mode
    -DUSE_FIXED_MEMORY_POOLS             ; Use fixed memory pools

; =============================================================================
; TESTING ENVIRONMENTS
; =============================================================================

; -----------------------------------------------------------------------------
; Native testing environment (runs on host computer, not hardware)
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUSE_OWN_ARDUINO_STR                ; Use custom Arduino string
    -DUSE_STD_IO                         ; Use standard I/O
    -DNO_ETL                             ; No ETL library
    -D__not_in_flash(section)=           ; Stub out flash decorations
    -D__not_in_flash_func(x)=            ; Stub out flash function decorations
    -DUSE_DYNAMIC_ALLOCATION             ; Use dynamic allocation on desktop

; For running Meson-based tests
test_framework = custom
test_build_src = false

; =============================================================================
; DEVELOPMENT ENVIRONMENTS (with extra debugging)
; =============================================================================

; -----------------------------------------------------------------------------
; Development build with debug symbols and assertions
; -----------------------------------------------------------------------------
[env:musicthing-debug]
extends = env:musicthing
build_type = debug
build_flags =
    ${env:musicthing.build_flags}
    -g                                   ; Debug symbols
    -DDEBUG                              ; Enable debug mode
    -DUSEQ_DEBUG=1                       ; Enable uSEQ-specific debugging
    -DUSEQ_DEVTOOLS=1                    ; Enable devtools telemetry

build_unflags =
    -O3                                  ; Remove optimization for debugging

; Reduce optimization for better debugging
extra_scripts =
    ; Can add custom build scripts here if needed

; -----------------------------------------------------------------------------
; Development build with extra verbose serial output
; -----------------------------------------------------------------------------
[env:musicthing-verbose]
extends = env:musicthing
build_flags =
    ${env:musicthing.build_flags}
    -DUSEQ_DEBUG=1                       ; Enable verbose debug output
    -DVERBOSE_SERIAL=1                   ; Extra serial verbosity
    -DUSEQ_DEVTOOLS=1                    ; Enable devtools telemetry

; =============================================================================
; HARDWARE BRING-UP ENVIRONMENTS
; =============================================================================
; Layered bring-up for validating hardware incrementally.
; Each layer adds one subsystem on top of the previous.
; Usage: pio run -e bringup-v1_0-L0   (serial only)
;        pio run -e bringup-v1_0-L5   (full except signal engine)

; ── v1.0 Bring-Up ────────────────────────────────────────────────────────────

; L0: Serial only — boots, prints over USB CDC, watchdog active
[env:bringup-v1_0-L0]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DUSE_FIXED_MEMORY_POOLS

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L1: + LED control (PIO PWM init, boot sequence LEDs, output LEDs)
[env:bringup-v1_0-L1]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L2: + Digital I/O (gate inputs I1/I2, binary outputs d1/d2/d3)
[env:bringup-v1_0-L2]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L3: + Analog inputs (CV inputs AI1/AI2 with median filter)
[env:bringup-v1_0-L3]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO
    -DENABLE_ANALOG_INPUTS

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L4: + Flash storage (LittleFS persistence)
[env:bringup-v1_0-L4]
board_build.filesystem_size = 1M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO
    -DENABLE_ANALOG_INPUTS
    -DENABLE_FLASH_STORAGE

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L5: + Signal engine (eval, execute, full tick loop)
[env:bringup-v1_0-L5]
board_build.filesystem_size = 1M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO
    -DENABLE_ANALOG_INPUTS
    -DENABLE_FLASH_STORAGE
    -DENABLE_SIGNAL_ENGINE

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; ── v0.2 Bring-Up ────────────────────────────────────────────────────────────

; L0: Serial only
[env:bringup-v0_2-L0]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2
    -DUSE_FIXED_MEMORY_POOLS

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L1: + LED control
[env:bringup-v0_2-L1]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L2: + Digital I/O (gate inputs, binary outputs d1-d4)
[env:bringup-v0_2-L2]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L3: + Rotary encoder
[env:bringup-v0_2-L3]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO
    -DENABLE_ENCODER_INPUT

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L4: + Flash storage
[env:bringup-v0_2-L4]
board_build.filesystem_size = 1M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO
    -DENABLE_ENCODER_INPUT
    -DENABLE_FLASH_STORAGE

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; L5: + Signal engine
[env:bringup-v0_2-L5]
board_build.filesystem_size = 1M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_0_2
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_DIGITAL_IO
    -DENABLE_ENCODER_INPUT
    -DENABLE_FLASH_STORAGE
    -DENABLE_SIGNAL_ENGINE

board_build.boot2 = boot2_w25q080_2_padded_checksum
board_build.flash_size = 8M

; ── Expander Bring-Up ─────────────────────────────────────────────────────────

; L0: Serial only
[env:bringup-expander-L0]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_EXPANDER_OUT_0_1
    -DUSE_FIXED_MEMORY_POOLS

; L1: + LED control (analogWrite LEDs on expander)
[env:bringup-expander-L1]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_EXPANDER_OUT_0_1
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL

; L2: + I2C (receives commands from host module)
[env:bringup-expander-L2]
board_build.filesystem_size = 0M
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_EXPANDER_OUT_0_1
    -DUSE_FIXED_MEMORY_POOLS
    -DENABLE_LED_CONTROL
    -DENABLE_I2C_NETWORKING
    -DENABLE_I2C_CLIENT
